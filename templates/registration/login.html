{% extends "base.html" %}

{% block title %}Sign in · Shop Inventory{% endblock %}

{% block content %}
<section class="panel narrow auth-card">
  <h1>Sign in</h1>
  <p class="muted">Use the account an administrator gave you — your group decides
    what you are allowed to do.</p>

  <form method="post" class="stacked">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn">Sign in</button>
      <a class="btn ghost" href="{% url 'inventory:dashboard' %}">Back</a>
    </div>
  </form>
</section>
{% endblock %}
